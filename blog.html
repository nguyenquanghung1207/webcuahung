<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết & Tin tức mới nhất - Hùng.dev</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="blog.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600|Outfit:500,700,800&subset=vietnamese&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header & Navbar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-code"></i> Hùng<span>.dev</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="blog.html" style="color: var(--accent-blue); font-weight: 600;">Bài viết</a>
            <a href="admin.html" class="btn-nav" style="background: rgba(56, 189, 248, 0.1); border: 1px solid var(--border-color); color: var(--accent-blue) !important;"><i class="fa-solid fa-pen"></i> Quản trị</a>
            <a href="index.html#contact" class="btn-nav">Liên hệ</a>
        </nav>
        <div class="menu-toggle" id="mobile-menu">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <!-- Blog Listing -->
    <section class="blog" style="padding-top: 60px;">
        <div class="section-title">
            <h2>Bài Viết & Tin Tức Mới Nhất</h2>
            <p>Cập nhật liên tiếp những kiến thức công nghệ & lập trình.</p>
        </div>

        <div class="blog-header">
            <div class="blog-controls">
                <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm bài viết...">
                <select id="category-filter" class="category-filter">
                    <option value="">Tất cả danh mục</option>
                    <option value="Công nghệ">Công nghệ</option>
                    <option value="Lập trình">Lập trình</option>
                    <option value="Tin tức">Tin tức</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
            <a href="admin.html" class="btn btn-outline"><i class="fa-solid fa-plus"></i> Đăng bài mới</a>
        </div>

        <div class="blog-grid" id="blog-list">
            <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Đang tải bài viết từ Database...</p>
        </div>

        <div class="pagination" id="pagination"></div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Hùng. All rights reserved. Designed with <i class="fa-solid fa-heart" style="color: #38bdf8;"></i> & Tech Blue Theme.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://oifrqjuzkppubvjchwsu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_I_2xFfFn-f8Pus83niNXwY_OZ1t87YA';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const listEl = document.getElementById('blog-list');
        const pagEl = document.getElementById('pagination');
        const searchEl = document.getElementById('search-input');
        const catEl = document.getElementById('category-filter');

        let posts = [];
        let page = 1;
        const perPage = 9;

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
        }

        async function loadPosts() {
            listEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">Đang tải bài viết...</p>';
            let query = supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            const cat = catEl.value;
            if (cat) query = query.eq('category', cat);
            const { data, error } = await query;
            if (error) {
                console.error(error);
                listEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#ef4444;">Lỗi tải bài viết từ Database.</p>';
                return;
            }
            posts = data || [];
            const q = searchEl.value.trim().toLowerCase();
            if (q) posts = posts.filter(p => ((p.title || '') + ' ' + (p.content || '')).toLowerCase().includes(q));
            page = 1;
            render();
        }

        function render() {
            const total = posts.length;
            const pages = Math.ceil(total / perPage) || 1;
            if (page > pages) page = pages;
            if (page < 1) page = 1;
            const start = (page - 1) * perPage;
            const pagePosts = posts.slice(start, start + perPage);

            listEl.innerHTML = '';
            if (pagePosts.length === 0) {
                listEl.innerHTML = '<div class="blog-empty"><p>Không tìm thấy bài viết nào.</p></div>';
            } else {
                pagePosts.forEach(post => {
                    const dateFormatted = new Date(post.created_at).toLocaleDateString('vi-VN');
                    const imgTag = post.image_url
                        ? `<img src="${post.image_url}" alt="${escapeHtml(post.title)}">`
                        : `<img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="Default">`;
                    const catBadge = post.category ? `<span class="category-badge">${escapeHtml(post.category)}</span>` : '';
                    const featuredTag = post.is_featured ? `<span class="featured-tag">NỔI BẬT</span>` : '';
                    const excerpt = (post.content || '').substring(0, 160);
                    const card = `
                        <article class="blog-card">
                            <div class="blog-img">
                                ${imgTag}
                            </div>
                            <div class="blog-content">
                                ${featuredTag}${catBadge}
                                <span class="blog-date"><i class="fa-regular fa-calendar"></i> ${dateFormatted}</span>
                                <h3>${escapeHtml(post.title)}</h3>
                                <p>${escapeHtml(excerpt)}...</p>
                                <a href="post.html?id=${post.id}" class="read-more">Xem chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                            </div>
                        </article>
                    `;
                    listEl.innerHTML += card;
                });
            }
            renderPagination(pages);
        }

        function renderPagination(pages) {
            pagEl.innerHTML = '';
            if (pages <= 1) return;
            const prev = document.createElement('button');
            prev.textContent = 'Trước';
            prev.disabled = page <= 1;
            prev.onclick = () => { page--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            pagEl.appendChild(prev);

            const info = document.createElement('span');
            info.textContent = 'Trang ' + page + ' / ' + pages;
            info.style.color = 'var(--text-muted)';
            info.style.fontSize = '14px';
            info.style.padding = '0 10px';
            pagEl.appendChild(info);

            const next = document.createElement('button');
            next.textContent = 'Sau';
            next.disabled = page >= pages;
            next.onclick = () => { page++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            pagEl.appendChild(next);
        }

        catEl.addEventListener('change', loadPosts);
        searchEl.addEventListener('input', () => { page = 1; loadPosts(); });

        loadPosts();
    </script>
</body>
</html>
